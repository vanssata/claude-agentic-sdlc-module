# Release the npm package `riskrails` when a version bump reaches main, or when a human
# pushes a tag v<version>.
#
# How a human releases:
#   python3 tools/sync-version.py X.Y.Z     # the four files, five version keys
#   a "## [X.Y.Z] - date" section in CHANGELOG.md (the Release notes carry it)
#   git commit -m "release X.Y.Z" -- package.json .claude-plugin/plugin.json \
#     .claude-plugin/marketplace.json .codex-plugin/plugin.json CHANGELOG.md
#   merge that commit to main                # this workflow tags vX.Y.Z, publishes, releases
# Pushing the tag by hand (git tag vX.Y.Z, then pushing it) still works.
# A push to main that changes package.json without a new version releases nothing: the
# detect job skips it when the tag or the Release already exists.
#
# After a red verify on a version bump nothing is tagged or published, and nothing retries
# it: "Re-run" tests the same red commit, and a fix on main that leaves package.json alone
# starts no run. Merge the fix to main, then tag it by hand: git tag vX.Y.Z <fix-commit>,
# then push that tag; the tag run tests and releases the fixed tree.
#
# One-time setup, either of:
#   - Trusted publishing (preferred, gives provenance with no secret): npmjs.com ->
#     riskrails -> Settings -> Trusted Publisher = GitHub Actions, repository
#     vanssata/claude-agentic-sdlc-module, workflow npm-publish.yml, environment npm.
#   - An NPM_TOKEN repository secret (a fallback; the publish step passes it along).
#
# Nothing here merges or deploys code: the job publishes the tested tree, creates the
# version tag on it when it is missing, and opens a GitHub Release, which notifies the
# repository's watchers.
name: Release

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
    paths: [package.json]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
    - uses: actions/checkout@v7
    - name: Decide the tag and whether a release is due
      id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        if [ "$REF_TYPE" = "tag" ]; then
          TAG="$GITHUB_REF_NAME"
        else
          TAG="v$(node -p "require('./package.json').version")"
        fi
        RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        if ! [[ "$TAG" =~ $RE ]]; then
          echo "::error::The version is not a version tag (vX.Y.Z or vX.Y.Z-prerelease)."
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        RELEASE=true
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG exists; nothing to do."
          RELEASE=false
        elif [ "$REF_TYPE" != "tag" ]; then
          REMOTE="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          # An annotated tag lists its own object and the peeled commit (^{}); the peeled one wins.
          TAGGED="$(printf '%s\n' "$REMOTE" | awk '$2 ~ /\^\{\}$/ {p=$1} $2 !~ /\^\{\}$/ {o=$1} END {print (p != "" ? p : o)}')"
          if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::warning::Tag $TAG already exists at $TAGGED, not at $GITHUB_SHA: bump the version in package.json."
            RELEASE=false
          fi
        fi
        echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  verify:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        # The migration test runs `git archive` on an old commit.
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Check required tools
      run: |
        for tool in bash jq git python3 patch diff; do
          command -v "$tool" || { echo "missing $tool"; exit 1; }
        done
    - name: The tag matches the five version keys
      run: python3 tools/sync-version.py --check --tag "$TAG"
    - name: The CHANGELOG has a section for this version
      run: python3 tools/changelog-section.py "${TAG#v}" >/dev/null
    # node before the tests: tests/test_dual_runtime_install.py runs the installer through it.
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Run the test suite
      env:
        # GitHub runners measured 1.3-1.8x slower than the development machine; the timing
        # budgets scale by this factor.
        AI_TIMED_FACTOR: "3"
      run: python3 -I tests/run_suite.py --serial test_guard_characterization.TestTimed --serial test_dialog_gate.TestGateFastPath
    - name: Run the end-to-end suite
      env:
        AI_TIMED_FACTOR: "3"
      run: AI_E2E=1 python3 -I -m unittest discover -s tests -p test_end_to_end.py
    - name: Lint
      run: |
        pip install pylint==4.0.8
        pylint $(git ls-files '*.py')
    - name: Pack dry run
      run: npm pack --dry-run
    # A first attempt must not republish a version: the tag was reused or the version not
    # bumped. A rerun (run_attempt > 1) is allowed through, because the publish job may have
    # uploaded the package and then failed at the GitHub Release step; the publish job skips
    # the upload when the registry already holds this version, and goes on to the Release.
    - name: This version is not on the registry yet
      env:
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        V="${TAG#v}"
        FOUND="$(npm view "riskrails@$V" version 2>/dev/null || true)"
        if [ -n "$FOUND" ] && [ "$RUN_ATTEMPT" = "1" ]; then
          echo "riskrails@$V is already on the registry; bump the version and tag again."
          exit 1
        fi

  publish:
    needs: [detect, verify]
    env:
      TAG: ${{ needs.detect.outputs.tag }}
    runs-on: ubuntu-latest
    # The environment lets the repository owner require a manual approval before this job
    # runs: GitHub -> Settings -> Environments -> npm -> Required reviewers.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org
    - name: Upgrade npm (trusted publishing needs 11.5.1 or newer)
      run: npm install -g npm@11
    - name: Publish to npm with provenance
      env:
        # Trusted publishing needs no token. NPM_TOKEN is only the fallback for the time
        # before the trusted publisher is configured. Not verified here: whether npm 11
        # ignores an empty NODE_AUTH_TOKEN (the secret unset) next to OIDC trusted
        # publishing, or tries it and fails; the first release without the secret shows it.
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        set -euo pipefail
        V="${TAG#v}"
        if [ "$(npm view "riskrails@$V" version 2>/dev/null || true)" = "$V" ]; then
          # A rerun must publish the same commit: a tag re-pointed since the upload fails here.
          HEAD_SHA="$(npm view "riskrails@$V" gitHead 2>/dev/null || true)"
          if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "riskrails@$V on the registry was built from $HEAD_SHA, not $GITHUB_SHA: the tag was re-pointed."
            exit 1
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::riskrails@$V has no gitHead on the registry; cannot compare it with $GITHUB_SHA."
          fi
          echo "riskrails@$V is already on the registry; skipping the upload, going on to the Release."
          exit 0
        fi
        case "$V" in
          # A prerelease (1.2.3-rc.1) must not become the "latest" dist-tag.
          *-*) npm publish --provenance --access public --tag next ;;
          *) npm publish --provenance --access public ;;
        esac
    - name: Create the tag
      run: |
        set -euo pipefail
        REMOTE="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
        TAGGED="$(printf '%s\n' "$REMOTE" | awk '$2 ~ /\^\{\}$/ {p=$1} $2 !~ /\^\{\}$/ {o=$1} END {print (p != "" ? p : o)}')"
        if [ -z "$TAGGED" ]; then
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
        elif [ "$TAGGED" = "$GITHUB_SHA" ]; then
          echo "Tag $TAG is already on the remote at this commit."
        else
          echo "Tag $TAG exists at $TAGGED, not at $GITHUB_SHA."
          exit 1
        fi
    - name: Announce as a GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        V="${TAG#v}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG exists; nothing to do."
          exit 0
        fi
        {
          echo "RiskRails $V is on npm."
          echo
          echo "Update in a terminal:"
          echo
          echo '    npx -y riskrails@latest --yes'
          echo
          echo "Inside Claude Code or Codex CLI:"
          echo
          echo '    ! npx -y riskrails@latest --yes'
          echo
          echo 'Then run `/rr-setup --update` in each project.'
          echo
          echo "npm: https://www.npmjs.com/package/riskrails/v/$V"
        } > "$RUNNER_TEMP/notes.md"
        echo >> "$RUNNER_TEMP/notes.md"
        python3 tools/changelog-section.py "$V" >> "$RUNNER_TEMP/notes.md"
        gh release create "$TAG" --title "RiskRails $V" \
          --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
