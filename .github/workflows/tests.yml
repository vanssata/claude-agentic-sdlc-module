name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 joins once the suite is green on it (known-risks: "The suite is red on Python 3.10")
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check required tools
      run: |
        for tool in bash jq git python3 patch diff; do
          command -v "$tool" || { echo "missing $tool"; exit 1; }
        done
    - name: Run the test suite
      run: python3 -I -m unittest discover -s tests -p 'test_*.py'
    - name: Run the end-to-end suite
      if: ${{ !cancelled() }}
      run: AI_E2E=1 python3 -I -m unittest discover -s tests -p test_end_to_end.py
