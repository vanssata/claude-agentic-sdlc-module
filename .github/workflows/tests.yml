# The SMOKE gate: a few fast, environment-independent test files on every push to main and
# every pull request. The FULL suite runs nightly and on demand (the `full` job below, one
# Python), on release tags (npm-publish.yml) and locally via verify_command in
# .ai/policies/testing.md.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 joins once the suite is green on it (known-risks: "The suite is red on Python 3.10")
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # The smoke list, one place. Keep it to files that are fast and need no network.
      SMOKE_FILES: >-
        tests/test_release.py tests/test_update_notice.py tests/test_install_routes.py
        tests/test_shared_tree.py tests/test_skills_surface.py tests/test_context_guard.py
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Check required tools
      run: |
        for tool in bash jq git python3 patch diff node; do
          command -v "$tool" || { echo "missing $tool"; exit 1; }
        done
    - name: Run the smoke tests
      run: python3 -I tests/run_suite.py $SMOKE_FILES
    - name: Run the end-to-end suite
      if: ${{ !cancelled() }}
      run: AI_E2E=1 python3 -I -m unittest discover -s tests -p test_end_to_end.py

  # The nightly and on-demand full suite: the release command, on the release Python.
  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AI_TIMED_FACTOR: "3"
    steps:
    - uses: actions/checkout@v4
      with:
        # The migration test runs `git archive` on an old commit.
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check required tools
      run: |
        for tool in bash jq git python3 patch diff node; do
          command -v "$tool" || { echo "missing $tool"; exit 1; }
        done
    - name: Run the test suite
      run: python3 -I tests/run_suite.py --serial test_guard_characterization.TestTimed --serial test_dialog_gate.TestGateFastPath
    - name: Run the end-to-end suite
      if: ${{ !cancelled() }}
      run: AI_E2E=1 python3 -I -m unittest discover -s tests -p test_end_to_end.py
